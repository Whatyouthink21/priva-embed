name: provider check

on:
  push:
    branches:
      - arena/**
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Resolve and probe every provider
        run: node scripts/provider-check.mjs
